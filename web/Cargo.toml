[package]
name = "editcastle-web"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2"
fontdb = "0.23"
png = "0.18"
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
fs2 = "0.4"
http-body-util = "0.1"
http-range-header = "0.4"
libc = "0.2"
ring = "0.17"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
scraper = { version = "0.29.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSData", "NSDictionary", "NSError", "NSObject", "NSString", "NSURL"] }
objc2-vision = { version = "0.3", default-features = false, features = ["VNCalculateImageAestheticsScoresRequest", "VNClassifyImageRequest", "VNDetectFaceRectanglesRequest", "VNObservation", "VNRequest", "VNRequestHandler", "VNTypes", "objc2-core-foundation"] }
